apiVersion: batch/v1
kind: Job
metadata:
  name: training-llm-mock-007
  namespace: observability-lab
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: training-llm-mock
    spec:
      restartPolicy: Never
      containers:
        - name: training-llm-mock
          image: training-mock:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8001
          args:
            - "--run-id"
            - "training-mock-007"
            - "--total-steps"
            - "100"
            - "--step-duration"
            - "5"
          env:
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: PUSHGATEWAY_URL
              value: "pushgateway.observability-lab.svc.cluster.local:9091"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: training-llm-mock
  namespace: observability-lab
spec:
  selector:
    app: training-llm-mock
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
