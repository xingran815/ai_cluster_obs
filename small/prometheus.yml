global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter.observability-lab.svc.cluster.local:9100
  - job_name: training-llm-mock
    static_configs:
      - targets:
        - training-llm-mock.observability-lab:8001
